name: Android build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Independently verify pinned Real-ESRGAN ONNX artifact
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="$RUNNER_TEMP/restoration-model"
          mkdir -p "$MODEL_DIR"
          MODEL="$MODEL_DIR/realesrgan-x4plus-fp32.onnx"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://huggingface.co/skillsafe-ai/realesrgan-x4plus/resolve/107475e49b7d46412cc966481efccc3500955801/model.onnx" \
            --output "$MODEL"
          echo "4851ec156207d271f5328605d0582eeb851e656227da8aca093ced9e60789291  $MODEL" | sha256sum --check
          python -m pip install --disable-pip-version-check onnx
          python tools/inspect_realesrgan_onnx.py "$MODEL" > "$MODEL_DIR/inspection.json"
          python - "$MODEL_DIR/inspection.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["model_sha256"] == "4851ec156207d271f5328605d0582eeb851e656227da8aca093ced9e60789291"
          assert report["model_bytes"] > 60_000_000
          assert len(report["inputs"]) == 1 and len(report["outputs"]) == 1
          source, output = report["inputs"][0], report["outputs"][0]
          assert source["name"] == "input" and source["element_type"] == 1
          assert output["name"] == "output" and output["element_type"] == 1
          assert len(source["shape"]) == 4 and source["shape"][1] == 3
          assert len(output["shape"]) == 4 and output["shape"][1] == 3
          assert any(item["version"] == 17 for item in report["opsets"])
          print(json.dumps(report, indent=2))
          PY

      - name: Test model inspection tooling
        run: python -m unittest discover -s tools/tests -v

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Gradle and Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            OCR-translation/bindings-bindgen/target
          key: ${{ runner.os }}-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APKs
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: searchandtranslate-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14


  runtime-footprint:
    name: Measure ONNX Runtime Android package footprint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download pinned ONNX Runtime Android AAR (measurement only)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.31.1"
          AAR="$RUNNER_TEMP/onnxruntime-android-$VERSION.aar"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/$VERSION/onnxruntime-android-$VERSION.aar" \
            --output "$AAR"
          echo "AAR_BYTES=$(stat -c '%s' "$AAR")"
          python - "$AAR" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              entries = [
                  (item.filename, item.file_size)
                  for item in archive.infolist()
                  if item.filename.startswith("jni/") and item.filename.endswith(".so")
              ]
          if not entries:
              raise SystemExit("No Android native libraries found in ONNX Runtime AAR")
          total = 0
          for name, size in sorted(entries):
              total += size
              print(f"{name}: {size} bytes ({size / 1024 / 1024:.2f} MiB)")
          print(f"TOTAL_NATIVE_BYTES={total}")
          print(f"TOTAL_NATIVE_MIB={total / 1024 / 1024:.2f}")
          PY
