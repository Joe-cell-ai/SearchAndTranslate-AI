name: Import upstream Android source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import SearchAndTranslate source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/fuzzyfly0/SearchAndTranslate.git /tmp/upstream
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/upstream/ ./
          git status --short

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import SearchAndTranslate upstream Android source"
          git push origin HEAD:main
